
name: Sync project-a to project-b

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project-a
        uses: actions/checkout@v4

      - name: Checkout project-b
        uses: actions/checkout@v4
        with:
          repository: shreyashvpatil/project-b
          ref: main
          token: ${{ secrets.PROJECT_B_TOKEN }}
          path: destination

      - name: Sync files
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            ./ destination/

      - name: Commit and push changes
        working-directory: destination
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Sync from project-a"
            git push origin main
          else
            echo "No changes to sync."
          fi
